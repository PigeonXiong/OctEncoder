# --------------------------------------------------------
# OctFormer: Octree-based Transformers for 3D Point Clouds - MAE Pre-training
# --------------------------------------------------------

SOLVER:
  gpu: 0,  # Single integer for GPU ID (not a tuple)
  run: train
  type: adamw
  logdir: logs/ADNI/mae_simple1

  test_every_epoch: 10
  log_per_iter: 100
  eval_epoch: 1
  max_epoch: 300
  epochs: 300

  # Learning rate settings
  lr: 0.0001
  lr_type: step
  milestones: [100, 150]  # Changed to list format
  warmup_epochs: 40
  warmup_init: 0.000001
  lr_min: 0.00001
  lr_power: 0.9
  
  # Optimizer settings
  weight_decay: 0.05
  clip_grad: -1.0
  
  # Checkpointing
  ckpt_num: 400
  checkpoint: ""
  resume: False
  best_val: min:loss

  # Misc
  batch_size: 8
  # num_workers: 4
  empty_cache: True
  progress_bar: True
  rand_seed: -1

DATA:
  train:
    name: tetmesh_mae
    depth: 6
    full_depth: 3
    adaptive: False
    uniform: False
    
    # Data loading
    location: data/ADNI
    filelist: data/ADNI/fps_train.txt
    location2: data/ADNI
    filelist2: data/ADNI/surface_train.txt
    #ptau_csv_path: data/patu_files/data_split_ptau_cutoff.csv
    batch_size: 64
    num_workers: 0
    in_memory: False
    take: -1
    
    # Augmentation
    distort: False
    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 1.0
    jitter: 0.0
    flip: (0.0, 0.0, 0.0)
    orient_normal: xyz
    shuffle: True
    pin_memory: True
    disable: False

  test:
    name: tetmesh_mae
    depth: 6
    full_depth: 3
    adaptive: False
    uniform: False
    
    # Data loading
    location: data/ADNI
    filelist: data/ADNI/fps_test.txt
    location2: data/ADNI
    filelist2: data/ADNI/surface_test.txt
    #ptau_csv_path: data/patu_files/data_split_ptau_cutoff.csv
    batch_size: 32
    num_workers: 0
    in_memory: False
    take: -1
    
    # Augmentation
    distort: False
    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 1.0
    jitter: 0.0
    flip: (0.0, 0.0, 0.0)
    orient_normal: xyz
    shuffle: False
    pin_memory: true
    disable: False

MODEL:
  name: octformermae
  channel: 3
  in_channels: 3
  feature: P
  nempty: true
  
  # Architecture parameters - Optimized for depth 7
  channels: [64, 64]    # Progressive channel expansion
  num_blocks: [1, 1]     # Multiple stages for hierarchical learning
  num_heads: [16, 16]      # Heads scaled with channels
  
  # MAE specific parameters
  mask_ratio: 0.5
  decoder_depth: 4
  decoder_num_heads: 8
  decoder_dim: 128
  patch_size: 64        # Larger patch size for better context
  dilation: 4           # Larger dilation for spatial relationships
  drop_path: 0.0      
  stem_down: 2          # Keep minimal stem down

LOSS:
  name: mae_loss
  num_class: 40  # Not used for MAE but required by config
  label_smoothing: 0.0 