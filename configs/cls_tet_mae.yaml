SOLVER:
  gpu: 0,
  run: train
  type: adamw
  best_val: max:accu

  logdir: logs/temp/test
  test_every_epoch: 1
  log_per_iter: 100

  lr: 0.0001
  lr_type: step

  weight_decay: 0.01
  milestones: (100,150)
  ckpt_num: 400

  checkpoint: ""  # Set to empty string to disable checkpoint loading
  resume: false    # Ensure we don't resume from checkpoint

DATA:
  train:
    # octree building
    depth: 7
    full_depth: 2

    # transformation
    orient_normal: xyz

    # data augmentations
    distort: False
    angle: (0, 0, 0)      # small rotation along z axis
    interval: (1, 1, 1)
    scale: 1.0
    jitter: 0.00

    # data loading
    location: data/adni
    filelist: data/adni/file_list/train.txt
    location2: data/adni_tet
    filelist2: data/adni_tet/file_list/train.txt
    ptau_csv_path: data/patu_files/data_split_ptau_cutoff.csv
    batch_size: 16
    shuffle: True
    pin_memory: True
    # num_workers: 1

  test:
    # octree building
    depth: 7
    full_depth: 2

    # transformation
    orient_normal: xyz

    # data augmentations
    distort: False
    angle: (0, 0, 0)      # small rotation along z axis
    interval: (5, 5, 5)
    scale: 1.0
    jitter: 0.0

    # data loading
    location: data/adni
    filelist: data/adni/file_list/test.txt
    location2: data/adni_tet
    filelist2: data/adni_tet/file_list/test.txt
    ptau_csv_path: data/patu_files/data_split_ptau_cutoff.csv
    batch_size: 16
    shuffle: False
    pin_memory: False
    # num_workers: 1

MODEL:
  name: octformercls_pretrain_mae
  nout: 2
  channel: 3
  # nempty: True    # different from MAE
  feature: P  # N -> Normal (3 channels); D -> Local displacement (1 channel)
  mae_ckpt: logs/temp/mae_d122/best_model.pth
  # Make sure the following parameters match the MAE model
  channels: [64, 128]
  num_blocks: [2, 2]
  num_heads: [4, 8]
  patch_size: 32
  dilation: 4
  drop_path: 0.2
  stem_down: 2
  # Freeze pretrained MAE or not
  freeze_encoder: false


LOSS:
  num_class: 2